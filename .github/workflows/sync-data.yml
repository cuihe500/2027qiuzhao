name: 双源自动同步 data.json

on:
  schedule:
    - cron: '15 */6 * * *' # 每 6 小时自动拉取双源并合并去重
  workflow_dispatch:

permissions:
  contents: write

concurrency: ${{ github.workflow }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 拉取双源校招数据、智能去重合并并校验
        run: |
          node scripts/sync-catalog.mjs
          jq -e '(.data | type == "array") and (.data | length >= 1000) and .cats and .rev' data.json > /dev/null
          jq -e '.rev and .updated and .count' version.json > /dev/null
          if git diff --quiet -- data.json version.json; then
            echo "双源合并结果无变化"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "双源同步 data.json：rev $(jq -r .rev data.json)，共 $(jq '.data | length' data.json) 家" -- data.json version.json
          git push
