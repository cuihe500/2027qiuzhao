name: 同步上游 data.json

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub 定时任务最短 5 分钟，高峰期会延迟
  workflow_dispatch:

permissions:
  contents: write

concurrency: ${{ github.workflow }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 拉取上游 data.json，有变化则提交
        run: |
          git fetch --depth=1 https://github.com/xinyangli-326/2027qiuzhao.git main
          git show FETCH_HEAD:data.json > data.json
          # 与页面「检查更新」的校验一致，结构不对就让任务失败，坏数据不入库
          jq -e '(.data | type == "array") and .cats and .rev' data.json > /dev/null
          if git diff --quiet -- data.json; then
            echo "上游 data.json 无变化"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "同步上游 data.json：rev $(jq -r .rev data.json)，$(jq '.data | length' data.json) 家（xinyangli-326/2027qiuzhao@$(git rev-parse --short FETCH_HEAD)）" -- data.json
          git push
